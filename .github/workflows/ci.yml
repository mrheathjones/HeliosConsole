name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.scheme }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        scheme: [HeliosConsole, HeliosMenuBar]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build ${{ matrix.scheme }}
        run: |
          set -o pipefail
          xcodebuild build \
            -project HeliosConsole.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            -quiet
